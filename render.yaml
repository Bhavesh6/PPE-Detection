databases:
  # Managed Postgres so accounts and the compliance record survive redeploys.
  # SQLite on Render's ephemeral filesystem is wiped on every restart.
  - name: ppe-detection-db
    databaseName: ppe_detection
    plan: free

services:
  - type: web
    name: ppe-detection-api
    env: python
    rootDir: backend
    buildCommand: "pip install -r ../requirements.txt"
    # Model inference on a cold container can exceed the default 30s worker
    # timeout, which would kill the first request.
    startCommand: "gunicorn app:app --timeout 120"
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.0
      - key: SECRET_KEY
        generateValue: true
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: GOOGLE_CLIENT_ID
        sync: false
      # Comma-separated frontend origins, e.g. https://your-app.vercel.app
      - key: CORS_ORIGINS
        sync: false
      # Render terminates TLS at its own load balancer, so every request
      # reaches the app from that one address. Left at the default 0 the
      # limiter buckets the whole internet together and legitimate callers
      # 429 each other out - measured locally, 24 distinct addresses shared
      # a single bucket. One hop, because there is exactly one proxy: any
      # higher and a caller could forge the address the limiter counts.
      - key: TRUSTED_PROXY_HOPS
        value: "1"
      # The public origin of THIS service, e.g. https://ppe-detection-api.onrender.com
      # Safety notices email an absolute link; without this the backend
      # refuses to send rather than posting one that will not resolve.
      - key: PUBLIC_BASE_URL
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: ppe-detection-db
          property: connectionString
