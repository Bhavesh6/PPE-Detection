services:
  - type: web
    name: ppe-detection-api
    env: python
    rootDir: backend
    buildCommand: "pip install -r ../requirements.txt"
    startCommand: "gunicorn app:app"
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.0
      - key: SECRET_KEY
        generateValue: true
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: DATABASE_URL
        value: sqlite:///app.db
