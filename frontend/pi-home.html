<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Device Home — SafetyFirst</title>
    <meta name="description" content="Touch launcher for the SafetyFirst checkpoint device.">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/app.css?v=20260805j">
    <style>
        /* Sized for the device panel — 800x480, 1024x600, or the Waveshare
           1280x800 — and driven by touch, so every target is finger-sized and
           nothing depends on hover. */
        html, body { height: 100%; }
        body {
            background: var(--bg);
            overflow: hidden;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }
        a { text-decoration: none; }

        .ph { display: flex; flex-direction: column; height: 100dvh;
              padding: clamp(16px, 3vh, 30px); gap: clamp(14px, 2.6vh, 24px); }

        .ph-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; flex-shrink: 0; }
        .ph-brand { display: flex; align-items: center; gap: 12px; }
        .ph-mark {
            width: clamp(36px, 6vh, 46px); aspect-ratio: 1; border-radius: 10px;
            background: var(--accent); color: #fff;
            display: flex; align-items: center; justify-content: center;
            font-size: clamp(1rem, 2.4vh, 1.3rem);
        }
        .ph-name { display: block; font-family: var(--font-head); font-weight: 700;
                   font-size: clamp(1.05rem, 2.6vh, 1.4rem); line-height: 1.1; color: var(--ink); }
        .ph-sub { display: block; font-size: clamp(.54rem, 1.1vh, .63rem); letter-spacing: .2em;
                  text-transform: uppercase; color: var(--accent); font-weight: 700; }

        .ph-clock { text-align: right; }
        .ph-time { font-family: var(--font-head); font-weight: 700;
                   font-size: clamp(1.5rem, 4.6vh, 2.4rem); line-height: 1;
                   font-variant-numeric: tabular-nums; color: var(--ink); }
        .ph-date { font-size: clamp(.66rem, 1.4vh, .8rem); color: var(--muted); margin-top: 4px; }

        .ph-status { display: flex; flex-wrap: wrap; gap: 8px; flex-shrink: 0; }
        .ph-chip {
            display: inline-flex; align-items: center; gap: 8px;
            padding: 7px 13px; border-radius: 999px;
            border: 1px solid var(--border); background: var(--surface);
            font-size: clamp(.64rem, 1.3vh, .74rem); font-weight: 600; color: var(--muted);
        }
        .ph-chip i { font-size: .48rem; }
        .ph-chip.is-ok { color: var(--ok); border-color: #c3ddcd; background: var(--ok-soft); }
        .ph-chip.is-bad { color: var(--danger); border-color: #f0cac7; background: var(--danger-soft); }

        /* minmax(0,1fr): without the zero floor the row is sized by its content
           and a short panel overflows, with no scrollbar to rescue it. */
        .ph-tiles {
            flex: 1 1 0; display: grid;
            grid-template-columns: repeat(3, 1fr);
            grid-template-rows: minmax(0, 1fr);
            gap: clamp(10px, 2vh, 18px); min-height: 0;
        }
        .ph-tile {
            display: flex; flex-direction: column; justify-content: space-between;
            padding: clamp(16px, 3vh, 24px);
            border-radius: var(--radius-md);
            border: 1px solid var(--border);
            background: var(--surface);
            box-shadow: var(--shadow);
            color: var(--ink);
            min-height: 0; overflow: hidden;
            transition: transform 140ms var(--ease-out), box-shadow 180ms var(--ease-out),
                        border-color 180ms var(--ease-out);
        }
        .ph-tile:active { transform: scale(.985); box-shadow: var(--shadow-sm); }
        .ph-tile-icon {
            width: clamp(40px, 6.5vh, 54px); aspect-ratio: 1; border-radius: 12px;
            display: flex; align-items: center; justify-content: center;
            font-size: clamp(1.05rem, 2.8vh, 1.5rem);
            background: var(--surface-alt); color: var(--accent);
            flex-shrink: 0;
        }
        /* These were inline spans, so the title and description ran together
           on one line. They have to be blocks. */
        .ph-tile-title {
            display: block; font-family: var(--font-head); font-weight: 700;
            font-size: clamp(.98rem, 2.5vh, 1.3rem); margin-top: auto; padding-top: 12px;
            color: var(--ink);
        }
        .ph-tile-desc {
            display: block; font-size: clamp(.68rem, 1.5vh, .82rem);
            color: var(--muted); margin-top: 5px; line-height: 1.45;
        }
        .ph-tile.is-primary { border-color: #e0c3b6; background: var(--accent-soft); }
        .ph-tile.is-primary .ph-tile-icon { background: var(--accent); color: #fff; }
        .ph-tile[hidden] { display: none; }

        .ph-foot { flex-shrink: 0; display: flex; align-items: center; justify-content: space-between;
                   gap: 12px; font-size: clamp(.62rem, 1.3vh, .74rem); color: var(--faint); }
        .ph-foot a { color: var(--muted); text-decoration: underline; }

        @media (max-height: 560px) {
            .ph { padding: 12px 16px; gap: 10px; }
            .ph-tile { padding: 13px; }
            .ph-tile-title { padding-top: 8px; }
        }
        @media (max-width: 700px) {
            .ph-tiles { grid-template-columns: 1fr; grid-auto-rows: minmax(0, 1fr); overflow-y: auto; }
            .ph-tile { flex-direction: row; align-items: center; gap: 14px; }
            .ph-tile-title { margin-top: 0; padding-top: 0; }
        }
        @media (prefers-reduced-motion: reduce) { .ph-tile:active { transform: none; } }
    </style>
</head>
<body>
    <div class="ph">
        <header class="ph-top">
            <div class="ph-brand">
                <span class="ph-mark"><i class="fas fa-hard-hat"></i></span>
                <span>
                    <span class="ph-name">SafetyFirst</span>
                    <span class="ph-sub">Checkpoint Device</span>
                </span>
            </div>
            <div class="ph-clock">
                <div class="ph-time" id="phTime">--:--</div>
                <div class="ph-date" id="phDate"></div>
            </div>
        </header>

        <div class="ph-status">
            <span class="ph-chip" id="chipApi"><i class="fas fa-circle"></i><span>Checking service…</span></span>
            <span class="ph-chip" id="chipCam"><i class="fas fa-circle"></i><span>Checking camera…</span></span>
            <span class="ph-chip" id="chipSecure"><i class="fas fa-circle"></i><span>Checking origin…</span></span>
        </div>

        <nav class="ph-tiles">
            <a href="kiosk.html" class="ph-tile is-primary">
                <span class="ph-tile-icon"><i class="fas fa-shield-halved"></i></span>
                <span>
                    <span class="ph-tile-title">Checkpoint</span>
                    <span class="ph-tile-desc">Run the gate. Verify PPE and grant or deny entry.</span>
                </span>
            </a>
            <a href="admin.html" class="ph-tile" id="tileAdmin">
                <span class="ph-tile-icon"><i class="fas fa-gauge-high"></i></span>
                <span>
                    <span class="ph-tile-title">Console</span>
                    <span class="ph-tile-desc">Site compliance, personnel and entry decisions.</span>
                </span>
            </a>
            <a href="history.html" class="ph-tile" id="tileRecords">
                <span class="ph-tile-icon"><i class="fas fa-clock-rotate-left"></i></span>
                <span>
                    <span class="ph-tile-title">Records</span>
                    <span class="ph-tile-desc">Past entry decisions logged on this device.</span>
                </span>
            </a>
        </nav>

        <footer class="ph-foot">
            <span id="phWho">Not signed in</span>
            <span><a href="login.html">Sign in</a> · <a href="index.html">About</a></span>
        </footer>
    </div>

    <script src="js/config.js?v=20260805j"></script>
    <script src="js/auth.js?v=20260805j"></script>
    <script>
        const el = (id) => document.getElementById(id);

        function clock() {
            const now = new Date();
            el('phTime').textContent = now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
            el('phDate').textContent = now.toLocaleDateString([], { weekday: 'long', day: 'numeric', month: 'short' });
        }
        clock();
        setInterval(clock, 15000);

        function chip(id, state, text) {
            const c = el(id);
            c.className = 'ph-chip' + (state ? ` is-${state}` : '');
            c.querySelector('span').textContent = text;
        }

        // Secure-origin check decides whether the camera can work at all.
        if (window.IS_SECURE_CONTEXT) {
            chip('chipSecure', 'ok', 'Secure origin');
        } else {
            chip('chipSecure', 'bad', 'Insecure origin — camera blocked');
        }

        // Is the detection service reachable?
        (async () => {
            try {
                const res = await fetch(`${window.API_BASE_URL}/api/health`, { cache: 'no-store' });
                chip('chipApi', res.ok ? 'ok' : 'bad', res.ok ? 'Detection service online' : 'Service error');
            } catch (e) {
                chip('chipApi', 'bad', 'Service unreachable');
            }
        })();

        // Is a camera actually attached? enumerateDevices works without
        // prompting, though labels stay empty until permission is granted.
        (async () => {
            if (!navigator.mediaDevices?.enumerateDevices) {
                return chip('chipCam', 'bad', 'No camera API');
            }
            try {
                const devices = await navigator.mediaDevices.enumerateDevices();
                const cams = devices.filter((d) => d.kind === 'videoinput');
                chip('chipCam', cams.length ? 'ok' : 'bad',
                    cams.length ? `${cams.length} camera${cams.length > 1 ? 's' : ''} detected` : 'No camera detected');
            } catch (e) {
                chip('chipCam', 'bad', 'Camera check failed');
            }
        })();

        // Identity + role-scoped tiles
        const user = Auth.getUser();
        if (user) {
            el('phWho').textContent = `${user.name}${user.is_admin ? ' · Administrator' : user.is_guest ? ' · Guest' : ''}`;
            if (!user.is_admin) el('tileAdmin').hidden = true;
            // A guest has no lasting record — history.html itself bounces
            // them straight back to Checkpoint, so the tile would silently
            // fail to do what it says rather than actually being disabled.
            if (user.is_guest) el('tileRecords').hidden = true;
        } else {
            el('tileAdmin').hidden = true;
            el('tileRecords').hidden = true;
        }
    </script>
</body>
</html>
