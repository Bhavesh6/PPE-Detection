<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Checkpoint — SafetyFirst</title>
    <meta name="description" content="Fullscreen PPE checkpoint display for gate-mounted kiosks.">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/app.css?v=20260804b">
    <style>
        /* A gate display is read standing up, from two or three metres away,
           often in bright daylight. Everything here is scaled and contrasted
           for that — not for a desk monitor. */
        html, body { height: 100%; overflow: hidden; }
        body {
            background: #070b14;
            color: #fff;
            font-family: 'Inter', sans-serif;
            cursor: none;                 /* no mouse at a gate */
            user-select: none;
        }
        .kiosk { display: flex; flex-direction: column; height: 100dvh; }

        .k-bar {
            display: flex; align-items: center; justify-content: space-between;
            padding: 18px 32px;
            border-bottom: 1px solid rgba(255,255,255,.08);
            flex-shrink: 0;
        }
        .k-brand { display: flex; align-items: center; gap: 12px; }
        .k-mark {
            width: 40px; height: 40px; border-radius: 8px;
            background: var(--amber); color: #0b1120;
            display: flex; align-items: center; justify-content: center;
            font-size: 1.2rem;
        }
        .k-name { font-family: 'Fraunces', Georgia, serif; font-weight: 800; font-size: 1.15rem; letter-spacing: -.01em; }
        .k-sub { font-size: .62rem; letter-spacing: .22em; text-transform: uppercase; color: var(--amber); font-weight: 700; }
        .k-meta { display: flex; align-items: center; gap: 22px; }
        .k-clock { font-variant-numeric: tabular-nums; font-size: 1.5rem; font-weight: 600; letter-spacing: -.01em; }
        .k-status {
            display: inline-flex; align-items: center; gap: 9px;
            font-size: .72rem; font-weight: 700; letter-spacing: .1em; text-transform: uppercase;
            color: #94a3b8;
        }
        .k-status i { font-size: .55rem; }
        .k-status.is-live { color: #4ade80; }

        .k-exit {
            width: 40px; height: 40px; border-radius: 9px;
            display: flex; align-items: center; justify-content: center;
            color: #334155; font-size: 1rem;
            border: 1px solid rgba(255,255,255,.07);
            transition: color 180ms var(--ease-out), border-color 180ms var(--ease-out);
        }
        .k-exit:hover, .k-exit:focus-visible { color: #94a3b8; border-color: rgba(255,255,255,.2); }

        .k-body { flex: 1; display: grid; grid-template-columns: 1fr 1fr; min-height: 0; }

        /* Camera side */
        .k-cam { position: relative; background: #000; overflow: hidden; }
        .k-cam video, .k-cam canvas.overlay {
            position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover;
        }
        .k-cam-idle {
            position: absolute; inset: 0;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            gap: 16px; color: #334155;
        }

        /* Verdict side */
        .k-verdict {
            display: flex; flex-direction: column; justify-content: center;
            padding: 40px 48px; gap: 34px;
            background: #0b1120;
            transition: background-color 260ms var(--ease-out);
        }
        .k-word {
            font-family: 'Fraunces', Georgia, serif; font-weight: 800;
            font-size: clamp(2.6rem, 6vw, 5.5rem);
            line-height: .98; letter-spacing: -.03em;
            color: #64748b;
            transition: color 260ms var(--ease-out);
        }
        .k-note { font-size: clamp(1rem, 1.6vw, 1.4rem); color: #94a3b8; line-height: 1.4; }

        .k-verdict[data-state="granted"] { background: #052e16; }
        .k-verdict[data-state="granted"] .k-word { color: #4ade80; }
        .k-verdict[data-state="granted"] .k-note { color: #86efac; }
        .k-verdict[data-state="denied"] { background: #3f0a0a; }
        .k-verdict[data-state="denied"] .k-word { color: #f87171; }
        .k-verdict[data-state="denied"] .k-note { color: #fca5a5; }

        /* PPE checklist — the actionable part when denied */
        .k-checks { display: flex; flex-direction: column; gap: 14px; }
        .k-check {
            display: flex; align-items: center; gap: 18px;
            padding: 16px 20px;
            border: 1px solid rgba(255,255,255,.12);
            border-radius: 12px;
            background: rgba(255,255,255,.03);
            transition: border-color 200ms var(--ease-out), background-color 200ms var(--ease-out);
        }
        .k-check-icon {
            width: 52px; height: 52px; border-radius: 10px; flex-shrink: 0;
            display: flex; align-items: center; justify-content: center;
            font-size: 1.4rem; color: #64748b;
            background: rgba(255,255,255,.05);
            transition: color 200ms var(--ease-out), background-color 200ms var(--ease-out);
        }
        .k-check-name { font-size: clamp(1rem, 1.5vw, 1.35rem); font-weight: 600; flex: 1; }
        .k-check-mark { font-size: 1.5rem; color: #475569; transition: color 200ms var(--ease-out); }
        .k-check[data-state="ok"] { border-color: rgba(74,222,128,.45); background: rgba(74,222,128,.08); }
        .k-check[data-state="ok"] .k-check-icon,
        .k-check[data-state="ok"] .k-check-mark { color: #4ade80; }
        .k-check[data-state="bad"] { border-color: rgba(248,113,113,.5); background: rgba(248,113,113,.1); }
        .k-check[data-state="bad"] .k-check-icon,
        .k-check[data-state="bad"] .k-check-mark { color: #f87171; }

        /* Start overlay — camera needs one user gesture before it can open */
        .k-start {
            position: fixed; inset: 0; z-index: 100;
            background: #070b14;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            gap: 26px; text-align: center; padding: 32px; cursor: pointer;
        }
        .k-start h1 { font-size: clamp(1.8rem, 4vw, 3rem); font-weight: 800; color: #fff; }
        .k-start p { color: #94a3b8; font-size: 1.1rem; max-width: 34rem; }
        .k-start-cta {
            margin-top: 8px; padding: 20px 46px; border-radius: 12px;
            background: var(--amber); color: #0b1120;
            font-weight: 700; font-size: 1.15rem; border: none;
            transition: transform 140ms var(--ease-out), background-color 180ms var(--ease-out);
        }
        .k-start-cta:active { transform: scale(.97); }

        @media (max-width: 900px) {
            .k-body { grid-template-columns: 1fr; grid-template-rows: 1fr 1fr; }
        }
        @media (prefers-reduced-motion: reduce) {
            .k-start-cta:active { transform: none; }
        }
    </style>
</head>
<body>
    <div class="kiosk">
        <header class="k-bar">
            <div class="k-brand">
                <span class="k-mark"><i class="fas fa-hard-hat"></i></span>
                <span>
                    <div class="k-name">SafetyFirst</div>
                    <div class="k-sub">Checkpoint</div>
                </span>
            </div>
            <div class="k-meta">
                <span class="k-status" id="kStatus"><i class="fas fa-circle"></i><span id="kStatusText">Offline</span></span>
                <span class="k-clock" id="kClock">--:--</span>
                <!-- Deliberately low-contrast: an operator needs a way out,
                     a worker at the gate shouldn't be invited to press it.
                     Esc does the same thing. -->
                <a href="pi-home.html" class="k-exit" id="kExit" title="Exit checkpoint (Esc)" aria-label="Exit checkpoint">
                    <i class="fas fa-xmark"></i>
                </a>
            </div>
        </header>

        <div class="k-body">
            <section class="k-cam">
                <div class="k-cam-idle" id="kCamIdle">
                    <i class="fas fa-video-slash" style="font-size:3rem"></i>
                    <p>Camera starting…</p>
                </div>
                <video id="videoFeed" autoplay playsinline muted style="display:none"></video>
                <canvas id="overlayCanvas" class="overlay" style="display:none"></canvas>
                <canvas id="captureCanvas" style="display:none"></canvas>
            </section>

            <section class="k-verdict" id="kVerdict" data-state="idle">
                <div>
                    <div class="k-word" id="kWord">Step Up</div>
                    <div class="k-note" id="kNote">Stand in front of the camera to be checked.</div>
                </div>
                <!-- Built from the site's configured policy, not hardcoded. -->
                <div class="k-checks" id="kChecks"></div>
            </section>
        </div>
    </div>

    <div class="k-start" id="kStart">
        <h1>Checkpoint Display</h1>
        <p id="kStartMsg">Tap to activate. The camera will stay on and check every person who steps in front of it.</p>
        <button class="k-start-cta" id="kStartBtn">Activate Checkpoint</button>
    </div>

    <script src="js/config.js?v=20260804b"></script>
    <script src="js/auth.js?v=20260804b"></script>
    <script src="js/camera.js?v=20260804b"></script>
    <script>
        const el = (id) => document.getElementById(id);
        let poll = null, cam = null, lastVerdict = null;

        // Clock
        function tick() {
            el('kClock').textContent = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
        }
        tick();
        setInterval(tick, 10000);

        function setStatus(live, text) {
            el('kStatus').className = 'k-status' + (live ? ' is-live' : '');
            el('kStatusText').textContent = text;
        }

        // Requirements come from the site's policy, so this gate display
        // never advertises something the gate no longer checks.
        let requiredPpe = [];

        const PPE_ICONS = {
            'Hardhat': 'fa-hard-hat',
            'Safety Vest': 'fa-vest',
            'Mask': 'fa-head-side-mask',
        };

        const slug = (item) => item.replace(/[^a-z0-9]/gi, '');

        function renderChecks() {
            el('kChecks').innerHTML = requiredPpe.map((item) => `
                <div class="k-check" data-state="idle" id="k-${slug(item)}">
                    <span class="k-check-icon"><i class="fas ${PPE_ICONS[item] || 'fa-shield-halved'}"></i></span>
                    <span class="k-check-name">${item}</span>
                    <span class="k-check-mark" id="kmark-${slug(item)}"><i class="fas fa-minus"></i></span>
                </div>`).join('');
        }

        function syncRequirements(list) {
            if (!Array.isArray(list)) return;
            if (JSON.stringify(list) === JSON.stringify(requiredPpe)) return;
            requiredPpe = list;
            renderChecks();
        }

        function setCheck(item, state) {
            const row = el(`k-${slug(item)}`);
            const mark = el(`kmark-${slug(item)}`);
            if (!row || !mark) return;
            row.dataset.state = state;
            const icon = state === 'ok' ? 'fa-check' : state === 'bad' ? 'fa-xmark' : 'fa-minus';
            mark.innerHTML = `<i class="fas ${icon}"></i>`;
        }

        function setAllChecks(state) {
            requiredPpe.forEach((item) => setCheck(item, state));
        }

        function render(verdict, missing) {
            const panel = el('kVerdict');
            if (verdict === 'granted') {
                panel.dataset.state = 'granted';
                el('kWord').textContent = 'Access Granted';
                el('kNote').textContent = 'All required equipment detected. You may enter.';
                setAllChecks('ok');
            } else if (verdict === 'denied') {
                panel.dataset.state = 'denied';
                el('kWord').textContent = 'Access Denied';
                el('kNote').textContent = missing.length
                    ? `Put on: ${missing.join(' and ')}.`
                    : 'Required equipment not detected.';
                requiredPpe.forEach((item) => setCheck(item, missing.includes(item) ? 'bad' : 'ok'));
            } else {
                panel.dataset.state = 'idle';
                el('kWord').textContent = 'Step Up';
                el('kNote').textContent = 'Stand in front of the camera to be checked.';
                setAllChecks('idle');
            }

            // Speak only on a change, so it doesn't chatter every poll.
            if (verdict !== lastVerdict && 'speechSynthesis' in window) {
                if (verdict === 'denied') {
                    speechSynthesis.speak(new SpeechSynthesisUtterance(
                        missing.length ? `Access denied. Put on your ${missing.join(' and ')}.` : 'Access denied.'
                    ));
                } else if (verdict === 'granted') {
                    speechSynthesis.speak(new SpeechSynthesisUtterance('Access granted.'));
                }
            }
            lastVerdict = verdict;
        }

        async function ensureSession() {
            if (Auth.isLoggedIn()) return true;
            // A gate display has nobody to type credentials, so it opens its
            // own guest session. Named identity arrives with the badge reader.
            try {
                const res = await fetch(`${window.API_BASE_URL}/api/auth/guest`, { method: 'POST' });
                const data = await res.json();
                if (!res.ok || !data.success) return false;
                Auth.setSession(data.token, data.user);
                return true;
            } catch (e) { return false; }
        }

        async function update() {
            try {
                const res = await Auth.fetch('/api/status');
                if (!res.ok) return;
                const d = await res.json();
                syncRequirements(d.required_ppe || []);
                render(d.verdict, d.missing_ppe || []);
            } catch (e) { /* transient */ }
        }

        async function activate() {
            el('kStartBtn').disabled = true;
            el('kStartBtn').textContent = 'Starting…';

            if (!window.IS_SECURE_CONTEXT) {
                el('kStartMsg').textContent =
                    `Camera blocked: ${window.location.origin} is not a secure origin. ` +
                    'Serve this page on the device itself (http://localhost) or over HTTPS.';
                el('kStartBtn').textContent = 'Cannot start';
                return;
            }

            if (!(await ensureSession())) {
                el('kStartMsg').textContent = 'Cannot reach the detection service. Check the API is running.';
                el('kStartBtn').disabled = false;
                el('kStartBtn').textContent = 'Retry';
                return;
            }

            try { await Auth.fetch('/api/start', { method: 'POST' }); } catch (e) { /* ignore */ }

            cam = new CameraFeed(el('videoFeed'), el('captureCanvas'), null);
            const ok = await cam.start();
            if (!ok) {
                el('kStartMsg').textContent = 'Camera unavailable. Check it is connected and permission was granted.';
                el('kStartBtn').disabled = false;
                el('kStartBtn').textContent = 'Retry';
                return;
            }

            el('videoFeed').style.display = 'block';
            el('overlayCanvas').style.display = 'block';
            el('kCamIdle').style.display = 'none';
            el('kStart').style.display = 'none';
            setStatus(true, 'Live');

            poll = setInterval(update, 900);

            // Kiosks run unattended — don't let the screen blank mid-shift.
            if ('wakeLock' in navigator) {
                navigator.wakeLock.request('screen').catch(() => { /* not critical */ });
            }
        }

        // Esc leaves the checkpoint. Without this the page is a trap: no nav,
        // no cursor, nothing to click.
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') window.location.href = 'pi-home.html';
        });

        el('kStartBtn').addEventListener('click', activate);
        el('kStart').addEventListener('click', (e) => { if (e.target === el('kStart')) activate(); });
    </script>
</body>
</html>
