<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign in — SafetyFirst</title>
    <meta name="description" content="Sign in to the SafetyFirst compliance console, or try the checkpoint as a guest.">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/app.css?v=20260807a">
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <style>
        /* Same language as the public site: warm paper, serif headline,
           burnt clay. A sign-in page that looks like a different product is
           where trust quietly leaks away. */
        body {
            min-height: 100dvh;
            display: flex; align-items: center; justify-content: center;
            padding: 32px 20px;
            background: var(--bg);
        }
        .auth { width: 100%; max-width: 430px; }
        .auth-brand {
            display: flex; align-items: center; justify-content: center; gap: 10px;
            margin-bottom: 26px; text-decoration: none;
        }
        .auth-mark {
            width: 34px; height: 34px; border-radius: 9px;
            background: var(--accent); color: #fff;
            display: flex; align-items: center; justify-content: center;
        }
        .auth-word { font-family: var(--font-head); font-weight: 700; font-size: 1.2rem; color: var(--ink); }
        .auth-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius-md);
            box-shadow: var(--shadow);
            overflow: hidden;
        }
        .auth-tabs { display: flex; border-bottom: 1px solid var(--border); }
        .auth-tab {
            flex: 1; padding: 15px 0; font-size: .88rem; font-weight: 600;
            background: none; border: none; cursor: pointer;
            border-bottom: 2px solid transparent;
            transition: color .18s var(--ease-out), border-color .18s var(--ease-out);
        }
        .auth-tab[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--accent); }
        .auth-tab[aria-selected="false"] { color: var(--faint); }
        .auth-tab[aria-selected="false"]:hover { color: var(--muted); }
        .auth-body { padding: 26px 26px 28px; }
        .auth-title { font-family: var(--font-head); font-size: 1.35rem; margin: 0 0 4px; }
        .auth-sub { font-size: .86rem; color: var(--muted); margin: 0 0 20px; }
        .rule { display: flex; align-items: center; gap: 12px; margin: 20px 0; }
        .rule::before, .rule::after { content: ''; height: 1px; background: var(--border); flex: 1; }
        .rule span { font-size: .7rem; letter-spacing: .1em; text-transform: uppercase; color: var(--faint); }
        .rule.hidden { display: none; }
        .foot-note { text-align: center; font-size: .78rem; color: var(--faint); margin-top: 10px; }
        .back { display: block; text-align: center; margin-top: 22px; font-size: .86rem; color: var(--muted); text-decoration: none; }
        .back:hover { color: var(--ink); }
        .stack > * + * { margin-top: 14px; }
        .stack.hidden { display: none; }
        .remember-row {
            display: flex; align-items: center; gap: 9px;
            font-size: .84rem; color: var(--muted); cursor: pointer;
        }
        .remember-row input { width: 16px; height: 16px; accent-color: var(--accent); cursor: pointer; }
    </style>
</head>
<body>
    <div class="auth">
        <a href="index.html" class="auth-brand">
            <span class="auth-mark"><i class="fas fa-hard-hat"></i></span>
            <span class="auth-word">SafetyFirst</span>
        </a>

        <div class="auth-card">
            <div class="auth-tabs" role="tablist">
                <button type="button" id="tabSignIn" class="auth-tab" role="tab" aria-selected="true" aria-controls="loginForm">Sign in</button>
                <button type="button" id="tabSignUp" class="auth-tab" role="tab" aria-selected="false" aria-controls="signupForm">Create account</button>
            </div>

            <div class="auth-body">
                <h1 class="auth-title">Welcome back</h1>
                <p class="auth-sub">Open the compliance console and your own records.</p>

                <div id="googleButton"></div>
                <div id="googleDivider" class="rule hidden"><span>or</span></div>

                <div id="formError" class="alert alert-danger hidden" style="margin-bottom:16px"></div>

                <form id="loginForm" class="stack" role="tabpanel" aria-labelledby="tabSignIn">
                    <div>
                        <label class="field-label" for="loginEmail">Email</label>
                        <input type="email" id="loginEmail" class="field" required autocomplete="email">
                    </div>
                    <div>
                        <label class="field-label" for="loginPassword">Password</label>
                        <input type="password" id="loginPassword" class="field" required autocomplete="current-password">
                    </div>
                    <label class="remember-row">
                        <input type="checkbox" id="rememberMe" checked>
                        <span>Keep me signed in on this device</span>
                    </label>
                    <button type="submit" id="loginSubmitBtn" class="btn btn-primary" style="width:100%">Sign in</button>
                </form>

                <form id="signupForm" class="stack hidden" role="tabpanel" aria-labelledby="tabSignUp">
                    <div>
                        <label class="field-label" for="signupName">Full name</label>
                        <input type="text" id="signupName" class="field" required autocomplete="name">
                    </div>
                    <div>
                        <label class="field-label" for="signupEmail">Email</label>
                        <input type="email" id="signupEmail" class="field" required autocomplete="email">
                    </div>
                    <div>
                        <label class="field-label" for="signupPassword">Password</label>
                        <input type="password" id="signupPassword" class="field" required minlength="8" autocomplete="new-password">
                        <p style="font-size:.76rem;color:var(--faint);margin-top:6px">At least 8 characters</p>
                    </div>
                    <button type="submit" id="signupSubmitBtn" class="btn btn-primary" style="width:100%">Create account</button>
                </form>

                <div class="rule"><span>or</span></div>

                <button id="guestBtn" type="button" class="btn btn-outline" style="width:100%">Continue as guest</button>
                <p class="foot-note">Try the checkpoint now — no account needed, no password to remember.</p>
            </div>
        </div>

        <a href="index.html" class="back"><i class="fas fa-arrow-left" style="margin-right:6px"></i>Back to home</a>
    </div>

    <script src="js/config.js?v=20260807a"></script>
    <script src="js/auth.js?v=20260807a"></script>
    <script>
        Auth.redirectIfLoggedIn();

        const formError = document.getElementById('formError');
        function showError(message) {
            formError.textContent = message;
            formError.classList.remove('hidden');
        }
        function clearError() {
            formError.classList.add('hidden');
        }

        // Tab switching
        const tabSignIn = document.getElementById('tabSignIn');
        const tabSignUp = document.getElementById('tabSignUp');
        const loginForm = document.getElementById('loginForm');
        const signupForm = document.getElementById('signupForm');

        function showTab(tab) {
            clearError();
            const isSignIn = tab === 'signin';
            tabSignIn.setAttribute('aria-selected', String(isSignIn));
            tabSignUp.setAttribute('aria-selected', String(!isSignIn));
            loginForm.classList.toggle('hidden', !isSignIn);
            signupForm.classList.toggle('hidden', isSignIn);
        }

        tabSignIn.addEventListener('click', () => showTab('signin'));
        tabSignUp.addEventListener('click', () => showTab('signup'));

        if (new URLSearchParams(window.location.search).get('mode') === 'signup') {
            showTab('signup');
        }

        // Guest
        async function continueAsGuest() {
            clearError();
            const guestBtn = document.getElementById('guestBtn');
            guestBtn.disabled = true;
            guestBtn.textContent = 'Starting guest session...';

            try {
                const res = await fetch(`${window.API_BASE_URL}/api/auth/guest`, { method: 'POST' });
                const data = await res.json();
                if (!res.ok || !data.success) {
                    showError(data.message || 'Could not start a guest session');
                    return;
                }
                Auth.setSession(data.token, data.user);
                window.location.href = 'visit-site.html';
            } catch (err) {
                showError('Could not reach the server. Is the API running?');
            } finally {
                guestBtn.disabled = false;
                guestBtn.textContent = 'Continue as Guest';
            }
        }
        document.getElementById('guestBtn').addEventListener('click', continueAsGuest);

        // Google
        async function handleGoogleCredentialResponse(response) {
            clearError();
            try {
                const res = await fetch(`${window.API_BASE_URL}/api/auth/google`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ credential: response.credential }),
                });
                const data = await res.json();
                if (!res.ok || !data.success) {
                    showError(data.message || 'Google sign-in failed');
                    return;
                }
                Auth.setSession(data.token, data.user);
                window.location.href = data.user.is_admin ? 'admin.html' : 'visit-site.html';
            } catch (err) {
                showError('Could not reach the server. Is the API running?');
            }
        }

        window.onload = function () {
            if (window.GOOGLE_CLIENT_ID && window.google) {
                google.accounts.id.initialize({
                    client_id: window.GOOGLE_CLIENT_ID,
                    callback: handleGoogleCredentialResponse,
                });
                google.accounts.id.renderButton(document.getElementById('googleButton'), {
                    theme: 'outline', size: 'large', width: 328, text: 'continue_with',
                });
                document.getElementById('googleDivider').classList.remove('hidden');
                document.getElementById('googleDivider').classList.add('flex');
            }
        };

        // Sign in submit
        loginForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            clearError();
            const submitBtn = document.getElementById('loginSubmitBtn');
            // Captured live rather than retyped below — a hand-typed reset
            // string ("Sign In") previously drifted from the real markup
            // ("Sign in") and the button's casing changed permanently after
            // the first failed attempt.
            const originalLabel = submitBtn.textContent;
            submitBtn.disabled = true;
            submitBtn.textContent = 'Signing in...';

            try {
                const res = await fetch(`${window.API_BASE_URL}/api/auth/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        email: document.getElementById('loginEmail').value.trim(),
                        password: document.getElementById('loginPassword').value,
                    }),
                });
                const data = await res.json();
                if (!res.ok || !data.success) {
                    showError(data.message || 'Invalid email or password');
                    return;
                }
                Auth.setSession(data.token, data.user, document.getElementById('rememberMe').checked);
                window.location.href = data.user.is_admin ? 'admin.html' : 'visit-site.html';
            } catch (err) {
                showError('Could not reach the server. Is the API running?');
            } finally {
                submitBtn.disabled = false;
                submitBtn.textContent = originalLabel;
            }
        });

        // Sign up submit
        signupForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            clearError();
            const submitBtn = document.getElementById('signupSubmitBtn');
            const originalLabel = submitBtn.textContent;
            submitBtn.disabled = true;
            submitBtn.textContent = 'Creating account...';

            try {
                const res = await fetch(`${window.API_BASE_URL}/api/auth/signup`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        name: document.getElementById('signupName').value.trim(),
                        email: document.getElementById('signupEmail').value.trim(),
                        password: document.getElementById('signupPassword').value,
                    }),
                });
                const data = await res.json();
                if (!res.ok || !data.success) {
                    showError(data.message || 'Could not create account');
                    return;
                }
                Auth.setSession(data.token, data.user);
                window.location.href = 'visit-site.html';
            } catch (err) {
                showError('Could not reach the server. Is the API running?');
            } finally {
                submitBtn.disabled = false;
                submitBtn.textContent = originalLabel;
            }
        });
    </script>
</body>
</html>
